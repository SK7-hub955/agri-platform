databases:
  # Managed PostgreSQL instance
  - name: agri-platform-db
    plan: free
    region: oregon
    databaseName: agriconnect
    user: agri

services:
  # Backend API Server
  - type: web
    name: agri-platform-api
    env: node
    plan: free
    region: oregon
    rootDir: server
    buildCommand: npm install
    # Apply schema + seed before starting (idempotent), then launch the API.
    startCommand: npm run migrate && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agri-platform-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_PASS
        sync: false
      - key: PORT
        value: "3001"
      - key: FRONTEND_URL
        value: https://agri-platform.onrender.com
      - key: NODE_ENV
        value: production
      - key: MARKET_PRICE_PROVIDER
        value: silv
      - key: MARKET_PRICE_CATEGORIES
        value: dairy,livestock

  # Frontend Static Site
  - type: static_site
    name: agri-platform
    env: static
    plan: free
    rootDir: agri-platform
    buildCommand: npm install && npm run build
    publishDirectory: dist
    envVars:
      - key: VITE_API_URL
        value: https://agri-platform-api.onrender.com
